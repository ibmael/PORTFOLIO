<nav
  class="fixed left-0 right-0 top-0 z-50 border-b border-slate-200/50 bg-white/60 backdrop-blur-xl backdrop-saturate-150 dark:border-[#24be5d]/10 dark:bg-[#0c0f12]/70"
>
  <div class="mx-auto flex h-14 max-w-5xl items-center justify-between px-6 md:px-12 lg:px-24">
    <a
      href="#home"
      (click)="closeMenu()"
      [class.active]="activeSection() === 'home'"
      class="font-bold text-[#24be5d]"
    >
      <span class="text-xs sm:text-base">&lt;IBRAHIMMAHMOUD /&gt;</span>
    </a>

    <ul class="hidden items-center gap-6 md:flex">
      @for (link of links; track link.href) {
        <li>
          <a
            [href]="link.href"
            [class.active]="activeSection() === link.href.replace('#', '')"
            class="animated-link text-xs text-slate-500 dark:text-slate-300"
          >
            {{ link.label }}
          </a>
        </li>
      }
    </ul>

    <div class="flex items-center gap-3">
      <button
        type="button"
        class="inline-flex h-10 w-10 items-center justify-center rounded-full text-slate-500 transition-colors hover:text-[#24be5d] dark:text-slate-300"
        aria-label="Toggle theme"
        (click)="themeService.toggleTheme()"
      >
        @if (themeService.theme() === 'dark') {
          <!-- Sun icon -->
          <svg
            viewBox="0 0 24 24"
            class="h-4 w-4"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 3v2.5M12 18.5V21M4.22 4.22 5.7 5.7M18.3 18.3l1.48 1.48M3 12h2.5M18.5 12H21M4.22 19.78 5.7 18.3M18.3 5.7l1.48-1.48"
              stroke-linecap="round"
            />
          </svg>
        } @else {
          <!-- Moon icon -->
          <svg
            viewBox="0 0 24 24"
            class="h-4 w-4"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            aria-hidden="true"
          >
            <path
              d="M20 14.5A7.5 7.5 0 0 1 11.5 6 6.5 6.5 0 1 0 20 14.5Z"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        }
      </button>

      <button
        type="button"
        class="inline-flex h-10 w-10 items-center justify-center rounded-md text-slate-500 transition-colors hover:text-[#24be5d] dark:text-slate-300 md:hidden"
        (click)="toggleMenu()"
        [attr.aria-expanded]="open()"
        aria-controls="mobile-menu"
        aria-label="Toggle menu"
      >
        @if (open()) {
          <span class="text-lg">✕</span>
        } @else {
          <span class="text-lg">☰</span>
        }
      </button>
    </div>
  </div>

  @if (open()) {
    <div
      id="mobile-menu"
      class="border-t border-slate-200 px-6 pb-4 pt-3 dark:border-slate-800 md:hidden"
    >
      <ul class="flex flex-col gap-3">
        @for (link of links; track link.href) {
          <li>
            <a
              [href]="link.href"
              [class.active]="activeSection() === link.href.replace('#', '')"
              class="animated-link text-sm text-slate-500 transition-colors hover:text-[#24be5d] dark:text-slate-300"
              (click)="closeMenu()"
            >
              {{ link.label }}
            </a>
          </li>
        }
      </ul>
    </div>
  }
</nav>
