<section
  id="skills"
  class="bg-[#f8f8f7] py-24 text-slate-900 dark:bg-[#0c0f12] dark:text-slate-100"
>
  <div class="mx-auto max-w-5xl px-6 md:px-12 lg:px-24">
    <app-scroll-reveal>
      <h2 class="section-kicker">// skills</h2>
      <h3 class="section-title mb-12">Tech Stack</h3>
    </app-scroll-reveal>

    <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-4 items-stretch auto-rows-fr">
      @for (group of groups; track group.category; let i = $index) {
        <app-scroll-reveal class="w-full" [delay]="i * 0.1">
          <article class="flowbite-card w-full h-full flex flex-col p-4 md:p-5">
            <h4 class="mb-4 text-xs uppercase tracking-widest text-[#24be5d]">
              {{ group.category }}
            </h4>
            <ul class="space-y-2 flex-1">
              @for (skill of group.items; track skill) {
                <li class="flex items-center gap-2 text-sm text-slate-600 dark:text-slate-300">
                  <span class="h-1.5 w-1.5 shrink-0 rounded-full bg-[#24be5d]/60"></span>
                  {{ skill }}
                </li>
              }
            </ul>
          </article>
        </app-scroll-reveal>
      }
    </div>
  </div>
</section>
