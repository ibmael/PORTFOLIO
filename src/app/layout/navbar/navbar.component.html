<nav
  class="fixed left-0 right-0 top-0 z-50 border-b border-border/60 bg-background/80 backdrop-blur-2xl transition-colors"
>
  <app-scroll-progress />

  <div class="mx-auto flex h-16 max-w-5xl items-center justify-between px-6 md:px-12 lg:px-24">
    <a
      href="#home"
      (click)="closeMenu()"
      class="min-w-0 max-w-[9rem] xs:max-w-none truncate font-mono text-[11px] sm:text-sm font-bold text-primary transition-opacity hover:opacity-80"
    >
      &lt;IBRAHIMMAHMOUD /&gt;
    </a>

    <ul class="hidden items-center gap-8 md:flex">
      @for (link of links; track link.href) {
        <li>
          <a
            [href]="link.href"
            [attr.aria-current]="activeSection() === link.href.replace('#', '') ? 'true' : null"
            class="relative block py-5 font-mono text-sm transition-colors hover:text-primary"
            [class.text-primary]="activeSection() === link.href.replace('#', '')"
            [class.text-muted-foreground]="activeSection() !== link.href.replace('#', '')"
          >
            {{ link.label }}
            @if (activeSection() === link.href.replace('#', '')) {
              <span class="absolute bottom-0 left-0 right-0 h-0.5 bg-primary shadow-[0_0_10px_hsl(var(--primary))]"></span>
            }
          </a>
        </li>
      }
    </ul>

    <div class="flex items-center gap-1.5 sm:gap-2">
      <!-- Command Palette trigger -->
      <button
        type="button"
        class="inline-flex h-9 items-center gap-1.5 rounded-md border border-border/80 bg-secondary/40 px-2 sm:px-2.5 text-xs font-mono text-muted-foreground transition-colors hover:border-primary/50 hover:bg-primary/10 hover:text-primary"
        aria-label="Open Command Palette (Ctrl+K)"
        (click)="commandPaletteService.open()"
      >
        <ng-icon name="lucideSearch" size="0.95rem" class="text-primary/90" />
        <span class="hidden sm:inline text-[11px] font-medium tracking-tight">
          {{ isMac ? '⌘K' : 'Ctrl K' }}
        </span>
      </button>

      <app-accent-picker />

      <button
        type="button"
        class="inline-flex h-9 w-9 items-center justify-center rounded-md text-muted-foreground transition-colors hover:bg-primary/10 hover:text-primary"
        aria-label="Toggle theme"
        (click)="themeService.toggleTheme()"
      >
        @if (themeService.theme() === 'dark') {
          <ng-icon name="lucideSun" size="1.1rem" />
        } @else {
          <ng-icon name="lucideMoon" size="1.1rem" />
        }
      </button>

      <button
        type="button"
        class="inline-flex h-9 w-9 items-center justify-center rounded-md text-muted-foreground transition-colors hover:bg-primary/10 hover:text-primary md:hidden"
        (click)="toggleMenu()"
        [attr.aria-expanded]="open()"
        aria-controls="mobile-menu"
        aria-label="Toggle menu"
      >
        @if (open()) {
          <ng-icon name="lucideX" size="1.25rem" />
        } @else {
          <ng-icon name="lucideMenu" size="1.25rem" />
        }
      </button>
    </div>
  </div>

  @if (open()) {
    <div
      id="mobile-menu"
      class="border-t border-border/60 bg-background/95 backdrop-blur-2xl px-6 pb-4 pt-2 md:hidden"
    >
      <ul class="flex flex-col gap-1">
        @for (link of links; track link.href) {
          <li>
            <a
              [href]="link.href"
              [class.text-primary]="activeSection() === link.href.replace('#', '')"
              [class.bg-primary/10]="activeSection() === link.href.replace('#', '')"
              [class.text-muted-foreground]="activeSection() !== link.href.replace('#', '')"
              class="block rounded-md px-3 py-2.5 font-mono text-sm transition-colors hover:bg-primary/5 hover:text-primary"
              (click)="closeMenu()"
            >
              {{ link.label }}
            </a>
          </li>
        }
      </ul>
    </div>
  }
</nav>
