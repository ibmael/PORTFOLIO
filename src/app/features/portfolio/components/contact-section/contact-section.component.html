<section
  id="contact"
  class="py-24 text-center transition-colors"
>
  <div class="mx-auto max-w-2xl px-6 md:px-8">
    <app-scroll-reveal>
      <p class="font-mono text-xs tracking-wider text-primary mb-2" appDecryptText>// contact</p>
      <h2 class="text-3xl md:text-4xl font-bold font-mono tracking-tight text-foreground mb-4">
        Let's Connect
      </h2>
      <p class="mx-auto mb-10 max-w-md font-sans text-sm leading-relaxed text-muted-foreground sm:text-base">
        I'm actively looking for front-end roles. Whether you have an opportunity or just want to
        chat about code — reach out!
      </p>
    </app-scroll-reveal>

    <app-scroll-reveal [delay]="0.15">
      <!-- Horizontal CTA row: [ Email ] [ Copy ] -->
      <div class="flex items-center justify-center gap-3">
        <!-- Primary Accent Email Button -->
        <a
          [href]="'mailto:' + email"
          class="contact-email-btn"
          aria-label="Send email to Ibrahim Mahmoud"
        >
          <ng-icon name="lucideMail" size="1.1rem" class="shrink-0" />
          <span class="truncate">{{ email }}</span>
        </a>

        <!-- Square Outlined Copy Button -->
        <button
          type="button"
          (click)="copyEmail()"
          class="contact-copy-btn"
          [attr.aria-label]="copied() ? 'Email copied' : 'Copy email to clipboard'"
          [title]="copied() ? 'Copied!' : 'Copy email'"
        >
          @if (copied()) {
            <ng-icon name="lucideCheck" size="1.1rem" class="text-primary" />
          } @else {
            <ng-icon name="lucideCopy" size="1.1rem" />
          }
        </button>
      </div>

      <!-- Horizontal Social Links Row: GitHub  LinkedIn  Resume -->
      <nav
        class="mt-10 flex flex-wrap items-center justify-center gap-6 sm:gap-8 font-mono text-xs sm:text-sm"
        aria-label="Social and resume links"
      >
        @for (social of socialLinks; track social.id) {
          <a
            [id]="social.id === 'resume' ? 'resume' : null"
            [href]="social.url"
            [target]="social.external ? '_blank' : null"
            [rel]="social.external ? 'noopener noreferrer' : null"
            [attr.download]="social.download ? '' : null"
            class="social-inline-link"
          >
            <ng-icon [name]="social.icon" size="1.1rem" class="shrink-0" />
            <span>{{ social.label }}</span>
          </a>
        }
      </nav>
    </app-scroll-reveal>
  </div>
</section>
